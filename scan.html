<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CLOUTE — Сканер входа</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23b06bff'/><stop offset='1' stop-color='%236a0dad'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><text x='16' y='23' font-family='Arial,Helvetica,sans-serif' font-size='21' font-weight='900' fill='%23fff' text-anchor='middle'>C</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{--p:#8b00ff;--pk:#ff0099}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#080010;color:#fff;min-height:100vh}
  .wrap{max-width:480px;margin:0 auto;padding:18px 16px 40px}
  h1{font-size:20px;font-weight:800;text-align:center;margin:10px 0 2px;background:linear-gradient(90deg,#c084fc,#ff0099);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .sub{text-align:center;color:#8779a6;font-size:12px;margin-bottom:22px}
  label{display:block;font-size:12px;color:#8779a6;margin:0 0 6px;text-transform:uppercase;letter-spacing:.05em}
  input{width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(139,0,255,.3);color:#fff;padding:14px 16px;border-radius:12px;font-size:18px;letter-spacing:.12em;text-align:center;text-transform:uppercase;outline:none;font-weight:700}
  button{width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;margin-top:14px;font-family:inherit}
  .bp{background:linear-gradient(135deg,var(--p),var(--pk));color:#fff;box-shadow:0 6px 20px -2px rgba(255,0,153,.4)}
  .bg{background:rgba(139,0,255,.14);color:#c084fc;border:1px solid rgba(139,0,255,.3)}
  .hd{display:flex;justify-content:space-between;align-items:center;background:rgba(139,0,255,.1);border:1px solid rgba(139,0,255,.25);border-radius:14px;padding:12px 14px;margin-bottom:14px}
  .hd .ev{font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hd .cnt{font-size:12px;color:#c084fc;white-space:nowrap;margin-left:10px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{flex:1;background:rgba(139,0,255,.1);border:1px solid rgba(139,0,255,.25);color:#8779a6;border-radius:11px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;margin-top:0}
  .tab.tab-on{background:linear-gradient(135deg,var(--p),var(--pk));color:#fff;border-color:transparent}
  .glabel{font-size:13px;font-weight:800;color:#c084fc;text-transform:uppercase;letter-spacing:.05em;margin:24px 0 10px;padding-top:18px;border-top:1px solid rgba(139,0,255,.15)}
  #reader{width:100%;border-radius:16px;overflow:hidden;border:1px solid rgba(139,0,255,.25)}
  #result{position:fixed;left:0;right:0;bottom:0;padding:26px 18px calc(26px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;transform:translateY(110%);transition:transform .2s;text-align:center;z-index:10}
  #result.show{transform:translateY(0)}
  #result .ic{font-size:46px}
  #result .ms{font-size:22px;font-weight:900;margin-top:4px}
  #result .nm{font-size:15px;margin-top:4px;opacity:.92}
  .ok{background:linear-gradient(180deg,#0c5c2e,#0a3d20)}
  .warn{background:linear-gradient(180deg,#6b5200,#4a3800)}
  .err{background:linear-gradient(180deg,#6b0a0a,#440606)}
  .hint{font-size:12px;color:#6b5f85;text-align:center;margin-top:14px;line-height:1.6}
  .link{color:#8b7cb8;text-decoration:underline;cursor:pointer}
  .hidden{display:none}
  .err-msg{color:#ff8a8a;font-size:13px;text-align:center;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>CLOUTE — Сканер входа</h1>
  <div class="sub">Контроль билетов на входе</div>

  <!-- Экран ввода кода -->
  <div id="screen-code">
    <label>Код сканера от организатора</label>
    <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="6 цифр" autocomplete="off">
    <button class="bp" onclick="startScan()">Начать сканирование</button>
    <div class="err-msg" id="code-err"></div>
    <div class="hint">Код выдаёт организатор в приложении CLOUTE.<br>Сканер работает в любом браузере — Telegram не нужен.</div>
  </div>

  <!-- Экран сканера -->
  <div id="screen-scan" class="hidden">
    <div class="hd">
      <div class="ev" id="ev-name">—</div>
      <div class="cnt" id="ev-cnt"></div>
    </div>
    <div id="camsec">
      <div id="reader"></div>
      <button class="bg" onclick="manualEntry()">⌨️ Ввести код билета вручную</button>
      <div class="err-msg" id="scan-err"></div>
    </div>
    <div class="glabel">📋 Гостевой список</div>
    <input id="g-search" placeholder="🔍 Поиск по имени или @нику" oninput="renderGuestList()" style="text-transform:none;text-align:left;letter-spacing:normal;font-size:15px;font-weight:400;margin-bottom:10px">
    <div id="glist"></div>
    <button class="bg" onclick="stopScan()" style="margin-top:16px">← Сменить событие</button>
  </div>
</div>

<div id="result"></div>

<script>
const API = location.origin;
let scanner = null, accessCode = '', lastCode = '', lastAt = 0, busy = false;

// префилл кода из ссылки ?k=CODE
const k = new URLSearchParams(location.search).get('k');
if (k) document.getElementById('code').value = k.trim().toUpperCase();

async function api(path, body){
  try {
    const r = await fetch(API + path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    let d = {}; try { d = await r.json(); } catch(e) {}
    return {ok:r.ok, status:r.status, data:d};
  } catch(e) {
    // Сеть отвалилась — не даём промису «упасть», иначе сканер завис бы навсегда
    return {ok:false, status:0, data:{}};
  }
}

async function startScan(){
  const code = document.getElementById('code').value.trim().toUpperCase();
  const err = document.getElementById('code-err'); err.textContent='';
  if(!code){ err.textContent='Введи код сканера'; return; }
  const r = await api('/api/scan/info', {code});
  if(!r.ok || r.data.error){ err.textContent = r.data.error || 'Неверный код'; return; }
  accessCode = code;
  document.getElementById('ev-name').textContent = r.data.event || 'Событие';
  updateCounters(r.data.checked_in, r.data.total);
  document.getElementById('screen-code').classList.add('hidden');
  document.getElementById('screen-scan').classList.remove('hidden');
  const hasQr=!!r.data.qr;
  document.getElementById('camsec').style.display=hasQr?'block':'none';
  const gl=document.querySelector('.glabel');gl.style.borderTop=hasQr?'':'none';gl.style.marginTop=hasQr?'':'6px';
  if(hasQr)startCamera();
  loadGuestList();
  startGuestPoll();
}

function updateCounters(ci, total){
  const el = document.getElementById('ev-cnt');
  if(typeof ci === 'number' && typeof total === 'number') el.textContent = `✅ ${ci} / ${total}`;
}

function startCamera(){
  scanner = new Html5Qrcode('reader');
  scanner.start({facingMode:'environment'}, {fps:10, qrbox:{width:240,height:240}}, onDecode, ()=>{})
    .catch(e => { document.getElementById('scan-err').textContent='Нет доступа к камере. Разреши камеру в браузере или вводи код вручную.'; });
}

async function stopScan(){
  stopGuestPoll();
  if(scanner){ try{ await scanner.stop(); scanner.clear(); }catch(e){} scanner=null; }
  document.getElementById('screen-scan').classList.add('hidden');
  document.getElementById('screen-code').classList.remove('hidden');
}

let _guests=[], _guestPoll=null;
function startGuestPoll(){ stopGuestPoll(); _guestPoll=setInterval(refreshGuests, 20000); }
function stopGuestPoll(){ if(_guestPoll){ clearInterval(_guestPoll); _guestPoll=null; } }
async function refreshGuests(){
  const r=await api('/api/scan/guests',{code:accessCode});
  if(r.ok && r.data && Array.isArray(r.data.guests)){
    if(JSON.stringify(r.data.guests)!==JSON.stringify(_guests)){ _guests=r.data.guests; renderGuestList(); }
  }
}
async function loadGuestList(){
  const list=document.getElementById('glist');
  list.innerHTML='<div style="text-align:center;color:#6b5f85;padding:20px">Загрузка…</div>';
  const r=await api('/api/scan/guests',{code:accessCode});
  _guests=(r.ok && r.data && Array.isArray(r.data.guests))?r.data.guests:[];
  renderGuestList();
}
function gAva(g){
  const n=(g.name||g.username||'?').trim();
  const ch=(n[0]||'?').toUpperCase();
  const cols=['#7c3aed,#ec4899','#2563eb,#06b6d4','#f59e0b,#ef4444','#10b981,#06b6d4','#8b5cf6,#6366f1','#ff0099,#8b00ff'];
  const c=cols[(n.charCodeAt(0)||0)%cols.length];
  return '<div style="width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,'+c+');display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:17px;flex-shrink:0">'+esc(ch)+'</div>';
}
function renderGuestList(){
  const q=(document.getElementById('g-search').value||'').toLowerCase().trim();
  const list=document.getElementById('glist');
  const f=_guests.filter(g=>!q||(g.name||'').toLowerCase().includes(q)||(g.username||'').toLowerCase().includes(q));
  if(!f.length){ list.innerHTML='<div style="text-align:center;color:#6b5f85;padding:24px;font-size:14px">'+(_guests.length?'Никого не найдено':'Список пуст')+'</div>'; return; }
  list.innerHTML=f.map(g=>{
    const sub=[g.username?'@'+esc(g.username):'',esc(g.note||'')].filter(Boolean).join(' · ');
    return '<div style="display:flex;align-items:center;gap:12px;padding:11px;border-radius:14px;margin-bottom:8px;background:'+(g.arrived?'rgba(0,255,136,.08)':'rgba(139,0,255,.06)')+';border:1px solid '+(g.arrived?'rgba(0,255,136,.22)':'rgba(139,0,255,.14)')+'">'
      +gAva(g)
      +'<div style="flex:1;min-width:0"><div style="font-size:16px;font-weight:600;'+(g.arrived?'opacity:.45':'')+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(g.name||('@'+(g.username||'')))+'</div>'+(sub?'<div style="font-size:12px;color:#8779a6">'+sub+'</div>':'')+'</div>'
      +'<button onclick="guestArrived('+g.id+','+(g.arrived?0:1)+')" style="flex-shrink:0;width:46px;height:46px;border-radius:13px;border:none;background:'+(g.arrived?'linear-gradient(135deg,#10b981,#06b6d4)':'rgba(139,0,255,.16)')+';color:#fff;font-size:20px;cursor:pointer">'+(g.arrived?'✓':'○')+'</button>'
      +'</div>';
  }).join('');
}
async function guestArrived(id,arrived){
  const r=await api('/api/scan/guest',{code:accessCode,guest_id:id,arrived:arrived});
  if(r.data&&r.data.status==='ok'){ const g=_guests.find(x=>x.id===id); if(g)g.arrived=arrived; renderGuestList(); beep(!!arrived); }
}

function onDecode(text){
  const now = Date.now();
  // антидребезг: тот же код в течение 3.5с игнорируем, и не сканируем во время обработки
  if(busy || (text === lastCode && now - lastAt < 3500)) return;
  lastCode = text; lastAt = now;
  checkTicket(text.trim());
}

async function manualEntry(){
  const t = prompt('Код билета (из QR):');
  if(t) checkTicket(t.trim());
}

async function checkTicket(ticket_code){
  if(busy) return;
  busy = true;
  let r;
  try { r = await api('/api/scan', {code:accessCode, ticket_code}); }
  finally { busy = false; }   // сбрасываем ВСЕГДА — сканер не должен залипать
  if(!r || r.status === 0){ showResult('warn','⚠️','Нет сети — повтори', ''); beep(false); return; }
  const s = r.data.status;
  if(s === 'ok'){ showResult('ok','✅','Проход разрешён', r.data.name); updateCounters(r.data.checked_in, r.data.total); beep(true); }
  else if(s === 'used'){ showResult('warn','⚠️','Уже использован', (r.data.name||'') + (r.data.used_at? ' · '+fmtTime(r.data.used_at):'')); beep(false); }
  else if(s === 'wrong_event'){ showResult('err','❌','Билет от другого события',''); beep(false); }
  else if(s === 'not_found'){ showResult('err','❌','Билет не найден',''); beep(false); }
  else if(s === 'bad_code'){ showResult('err','❌','Код сканера недействителен',''); }
  else { showResult('err','❌','Ошибка проверки',''); }
}

let hideTimer = null;
function showResult(cls, ic, msg, nm){
  const el = document.getElementById('result');
  el.className = cls + ' show';
  el.innerHTML = `<div class="ic">${ic}</div><div class="ms">${esc(msg)}</div>${nm?`<div class="nm">${esc(nm)}</div>`:''}`;
  clearTimeout(hideTimer);
  hideTimer = setTimeout(()=>{ el.classList.remove('show'); }, 2200);
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtTime(s){ const m=String(s).match(/(\d{2}:\d{2})/); return m?m[1]:''; }
function beep(good){
  try{
    if(navigator.vibrate) navigator.vibrate(good?80:[60,40,60]);
  }catch(e){}
}
</script>
</body>
</html>
