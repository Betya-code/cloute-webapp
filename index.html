<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CLOUTE — Тусовки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@400;500;600&display=swap');

:root {
  --purple: #8b00ff;
  --pink: #ff0099;
  --cyan: #00d4ff;
  --green: #00ff88;
  --dark: #080010;
  --card: #12001e;
  --card2: #0a0018;
  --text: #e8d4ff;
  --muted: #664488;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--dark);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: -100px; left: -100px;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(139,0,255,.12), transparent 60%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  bottom: -80px; right: -80px;
  width: 350px; height: 350px;
  background: radial-gradient(circle, rgba(255,0,153,.08), transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ── VIEWS ── */
.view { display: none; position: relative; z-index: 1; min-height: 100vh; }
.view.active { display: block; }

/* ── HEADER ── */
.header {
  padding: 20px 20px 0;
  position: sticky; top: 0;
  background: rgba(8,0,16,.95);
  backdrop-filter: blur(20px);
  z-index: 100;
  border-bottom: 1px solid rgba(139,0,255,.15);
  padding-bottom: 16px;
}
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.logo {
  font-family: 'Unbounded', sans-serif;
  font-size: 20px; font-weight: 900;
  background: linear-gradient(90deg, #fff, #c084fc, var(--cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -.02em;
}
.admin-btn {
  background: rgba(139,0,255,.15);
  border: 1px solid rgba(139,0,255,.3);
  color: #c084fc;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px; font-weight: 600;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
}

/* ── TABS ── */
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  padding: 7px 16px;
  border-radius: 20px;
  font-size: 12px; font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  border: 1px solid rgba(139,0,255,.2);
  background: transparent;
  color: var(--muted);
  transition: all .2s;
  font-family: 'Inter', sans-serif;
}
.tab.active {
  background: linear-gradient(90deg, var(--purple), var(--pink));
  border-color: transparent;
  color: #fff;
  box-shadow: 0 4px 16px rgba(139,0,255,.35);
}

/* ── HERO BANNER ── */
.hero-banner {
  margin: 16px;
  background: linear-gradient(135deg, #1a0033, #000d1a);
  border: 1px solid rgba(139,0,255,.3);
  border-radius: 20px;
  padding: 24px 20px;
  position: relative;
  overflow: hidden;
}
.hero-banner::before {
  content: '🎉';
  position: absolute;
  right: 20px; top: 50%;
  transform: translateY(-50%);
  font-size: 60px;
  opacity: .15;
}
.hero-banner h2 {
  font-family: 'Unbounded', sans-serif;
  font-size: 18px; font-weight: 900;
  color: #fff; margin-bottom: 6px;
}
.hero-banner p { font-size: 13px; color: #888; line-height: 1.5; }
.hero-count {
  margin-top: 14px;
  display: flex; gap: 16px;
}
.hero-stat { }
.hero-stat-num {
  font-family: 'Unbounded', sans-serif;
  font-size: 22px; font-weight: 900;
  background: linear-gradient(90deg, var(--purple), var(--pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero-stat-label { font-size: 10px; color: #666; margin-top: 2px; }

/* ── SECTION TITLE ── */
.section-title {
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .1em;
  color: #664488;
  padding: 0 16px;
  margin: 20px 0 10px;
}

/* ── EVENT CARD ── */
.events-list { padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }

.event-card {
  background: var(--card);
  border: 1px solid rgba(139,0,255,.2);
  border-radius: 18px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  position: relative;
}
.event-card:active { transform: scale(.98); }
.event-card.hot {
  border-color: rgba(255,0,153,.3);
  box-shadow: 0 0 20px rgba(255,0,153,.08);
}

.event-img {
  width: 100%; height: 140px;
  background: linear-gradient(135deg, #1a0033, #000d1a);
  display: flex; align-items: center; justify-content: center;
  font-size: 50px;
  position: relative;
}
.event-img-bg {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 50%, rgba(8,0,16,.9) 100%);
}
.event-badges {
  position: absolute; top: 10px; left: 10px;
  display: flex; gap: 6px;
}
.badge {
  padding: 4px 10px; border-radius: 20px;
  font-size: 10px; font-weight: 700;
}
.badge-hot { background: rgba(255,0,153,.9); color: #fff; }
.badge-free { background: rgba(0,255,136,.9); color: #000; }
.badge-soon { background: rgba(255,160,0,.9); color: #000; }

.event-body { padding: 14px; }
.event-date-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 6px;
}
.event-date {
  font-size: 11px; font-weight: 600;
  color: var(--cyan);
  text-transform: uppercase; letter-spacing: .05em;
}
.event-price {
  font-size: 12px; font-weight: 700;
  background: linear-gradient(90deg, var(--purple), var(--pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.event-name {
  font-family: 'Unbounded', sans-serif;
  font-size: 15px; font-weight: 700;
  color: #fff; margin-bottom: 6px;
  line-height: 1.3;
}
.event-place {
  font-size: 12px; color: #886699;
  display: flex; align-items: center; gap: 4px;
}
.event-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid rgba(139,0,255,.1);
}
.event-time { font-size: 11px; color: #664488; }
.btn-details {
  background: linear-gradient(90deg, var(--purple), var(--pink));
  color: #fff; border: none;
  padding: 7px 16px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: 'Inter', sans-serif;
}

/* ── EVENT DETAIL VIEW ── */
.detail-header {
  position: relative;
  height: 220px;
  background: linear-gradient(135deg, #1a0033, #000d1a);
  display: flex; align-items: center; justify-content: center;
  font-size: 80px;
  overflow: hidden;
}
.detail-header::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 40%, var(--dark) 100%);
}
.back-btn {
  position: absolute; top: 16px; left: 16px;
  z-index: 10;
  background: rgba(0,0,0,.5);
  border: 1px solid rgba(255,255,255,.15);
  color: #fff; padding: 8px 14px;
  border-radius: 20px; font-size: 13px;
  cursor: pointer; font-family: 'Inter', sans-serif;
  backdrop-filter: blur(10px);
}
.detail-body { padding: 20px; }
.detail-name {
  font-family: 'Unbounded', sans-serif;
  font-size: 22px; font-weight: 900;
  color: #fff; margin-bottom: 16px;
  line-height: 1.2;
}
.detail-info { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.detail-row {
  display: flex; align-items: center; gap: 12px;
  background: rgba(139,0,255,.06);
  border: 1px solid rgba(139,0,255,.12);
  border-radius: 12px; padding: 12px 14px;
}
.detail-row-icon { font-size: 18px; }
.detail-row-text { }
.detail-row-label { font-size: 10px; color: #664488; text-transform: uppercase; letter-spacing: .06em; }
.detail-row-val { font-size: 14px; color: #e8d4ff; font-weight: 500; margin-top: 1px; }
.detail-desc {
  font-size: 14px; color: #886699;
  line-height: 1.7; margin-bottom: 24px;
}
.btn-buy {
  width: 100%;
  background: linear-gradient(90deg, var(--purple), var(--pink));
  color: #fff; border: none;
  padding: 16px; border-radius: 16px;
  font-size: 16px; font-weight: 700;
  cursor: pointer; font-family: 'Unbounded', sans-serif;
  letter-spacing: -.01em;
  box-shadow: 0 8px 30px rgba(139,0,255,.4);
}

/* ── ADMIN VIEW ── */
.admin-header {
  padding: 20px;
  background: rgba(8,0,16,.98);
  border-bottom: 1px solid rgba(139,0,255,.2);
  display: flex; align-items: center; gap: 12px;
}
.admin-back {
  background: rgba(139,0,255,.15);
  border: 1px solid rgba(139,0,255,.3);
  color: #c084fc; padding: 8px 14px;
  border-radius: 20px; font-size: 12px;
  cursor: pointer; font-family: 'Inter', sans-serif;
}
.admin-title {
  font-family: 'Unbounded', sans-serif;
  font-size: 16px; font-weight: 900; color: #fff;
}

.admin-stats {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; padding: 16px;
}
.stat-card {
  background: var(--card);
  border: 1px solid rgba(139,0,255,.2);
  border-radius: 14px; padding: 16px;
  text-align: center;
}
.stat-num {
  font-family: 'Unbounded', sans-serif;
  font-size: 28px; font-weight: 900;
  background: linear-gradient(90deg, var(--purple), var(--pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.stat-label { font-size: 11px; color: #664488; margin-top: 4px; }

.admin-section { padding: 0 16px; margin-bottom: 16px; }
.admin-section-title {
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .1em;
  color: #664488; margin-bottom: 10px;
}

.add-event-btn {
  width: 100%;
  background: linear-gradient(90deg, var(--purple), var(--pink));
  color: #fff; border: none;
  padding: 16px; border-radius: 16px;
  font-size: 15px; font-weight: 700;
  cursor: pointer; font-family: 'Unbounded', sans-serif;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 8px 30px rgba(139,0,255,.35);
  margin-bottom: 16px;
}

.admin-event-card {
  background: var(--card);
  border: 1px solid rgba(139,0,255,.2);
  border-radius: 14px; padding: 14px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.admin-event-info .aei-name { font-size: 14px; font-weight: 600; color: #fff; }
.admin-event-info .aei-date { font-size: 11px; color: #664488; margin-top: 2px; }
.delete-btn {
  background: rgba(255,0,80,.1);
  border: 1px solid rgba(255,0,80,.2);
  color: #ff4466; padding: 6px 12px;
  border-radius: 10px; font-size: 12px;
  cursor: pointer; font-family: 'Inter', sans-serif;
}

/* ── EMPTY STATE ── */
.empty {
  text-align: center; padding: 48px 20px;
  color: #664488;
}
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: 14px; line-height: 1.6; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(8,0,16,.97);
  border-top: 1px solid rgba(139,0,255,.15);
  display: flex;
  backdrop-filter: blur(20px);
  z-index: 200;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
  flex: 1; padding: 10px 0;
  display: flex; flex-direction: column;
  align-items: center; gap: 3px;
  cursor: pointer;
  transition: all .2s;
}
.nav-icon { font-size: 20px; }
.nav-label { font-size: 9px; color: #443355; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.nav-item.active .nav-label { color: var(--purple); }

.main-content { padding-bottom: 70px; }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════
     VIEW: ГЛАВНАЯ (пользователь)
═══════════════════════════════════════ -->
<div id="view-home" class="view active">
  <div class="header">
    <div class="header-top">
      <div class="logo">CLOUTE</div>
      <button class="admin-btn" onclick="showAdmin()">⚙️ Админ</button>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="filterEvents('all', this)">Все</div>
      <div class="tab" onclick="filterEvents('today', this)">Сегодня</div>
      <div class="tab" onclick="filterEvents('week', this)">На неделе</div>
      <div class="tab" onclick="filterEvents('month', this)">В мае</div>
    </div>
  </div>

  <div class="main-content">
    <div class="hero-banner">
      <h2>Тусовки Москвы 🔥</h2>
      <p>Все вечеринки города в одном месте</p>
      <div class="hero-count">
        <div class="hero-stat">
          <div class="hero-stat-num" id="total-count">0</div>
          <div class="hero-stat-label">событий</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-num" id="this-week-count">0</div>
          <div class="hero-stat-label">на этой неделе</div>
        </div>
      </div>
    </div>

    <div class="section-title">🔥 Ближайшие события</div>
    <div class="events-list" id="events-list">
      <div class="empty">
        <div class="empty-icon">🎉</div>
        <div class="empty-text">Скоро здесь появятся<br>первые тусовки!</div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active">
      <div class="nav-icon">🏠</div>
      <div class="nav-label">Главная</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">📅</div>
      <div class="nav-label">Календарь</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">🔍</div>
      <div class="nav-label">Поиск</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">🎟</div>
      <div class="nav-label">Билеты</div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════
     VIEW: ДЕТАЛИ СОБЫТИЯ
═══════════════════════════════════════ -->
<div id="view-detail" class="view">
  <div class="detail-header" id="detail-header">
    <button class="back-btn" onclick="showHome()">← Назад</button>
    <span id="detail-emoji">🎉</span>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,#080010 100%)"></div>
  </div>
  <div class="detail-body">
    <div class="detail-name" id="detail-name"></div>
    <div class="detail-info" id="detail-info"></div>
    <div class="detail-desc" id="detail-desc"></div>
    <button class="btn-buy" id="detail-buy" onclick="buyTicket()">🎟 Купить билет</button>
  </div>
</div>

<!-- ═══════════════════════════════════════
     VIEW: АДМИН ПАНЕЛЬ
═══════════════════════════════════════ -->
<div id="view-admin" class="view">
  <div class="admin-header">
    <button class="admin-back" onclick="showHome()">← Выход</button>
    <div class="admin-title">Панель админа</div>
  </div>

  <div class="admin-stats">
    <div class="stat-card">
      <div class="stat-num" id="admin-total">0</div>
      <div class="stat-label">Всего событий</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="admin-month">0</div>
      <div class="stat-label">В этом месяце</div>
    </div>
  </div>

  <div class="admin-section">
    <button class="add-event-btn" onclick="showAddForm()">
      ➕ Добавить тусовку
    </button>
  </div>

  <!-- ФОРМА ДОБАВЛЕНИЯ -->
  <div id="add-form" style="display:none;padding:0 16px 16px">
    <div class="admin-section-title">Новое событие</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <input id="f-name" placeholder="🎉 Название тусовки" style="background:#12001e;border:1px solid rgba(139,0,255,.3);color:#fff;padding:13px 16px;border-radius:12px;font-size:14px;font-family:'Inter',sans-serif;outline:none;width:100%">
      <input id="f-date" placeholder="📅 Дата (25.06.2026)" style="background:#12001e;border:1px solid rgba(139,0,255,.3);color:#fff;padding:13px 16px;border-radius:12px;font-size:14px;font-family:'Inter',sans-serif;outline:none;width:100%">
      <input id="f-time" placeholder="⏰ Время (22:00)" style="background:#12001e;border:1px solid rgba(139,0,255,.3);color:#fff;padding:13px 16px;border-radius:12px;font-size:14px;font-family:'Inter',sans-serif;outline:none;width:100%">
      <input id="f-venue" placeholder="📍 Место (Club XO, Москва)" style="background:#12001e;border:1px solid rgba(139,0,255,.3);color:#fff;padding:13px 16px;border-radius:12px;font-size:14px;font-family:'Inter',sans-serif;outline:none;width:100%">
      <input id="f-price" placeholder="💵 Цена (800 ₽ или бесплатно)" style="background:#12001e;border:1px solid rgba(139,0,255,.3);color:#fff;padding:13px 16px;border-radius:12px;font-size:14px;font-family:'Inter',sans-serif;outline:none;width:100%">
      <input id="f-link" placeholder="🔗 Ссылка на билеты (или нет)" style="background:#12001e;border:1px solid rgba(139,0,255,.3);color:#fff;padding:13px 16px;border-radius:12px;font-size:14px;font-family:'Inter',sans-serif;outline:none;width:100%">
      <textarea id="f-desc" placeholder="📝 Описание события..." rows="3" style="background:#12001e;border:1px solid rgba(139,0,255,.3);color:#fff;padding:13px 16px;border-radius:12px;font-size:14px;font-family:'Inter',sans-serif;outline:none;width:100%;resize:none"></textarea>
      <select id="f-emoji" style="background:#12001e;border:1px solid rgba(139,0,255,.3);color:#fff;padding:13px 16px;border-radius:12px;font-size:14px;font-family:'Inter',sans-serif;outline:none;width:100%">
        <option value="🎉">🎉 Вечеринка</option>
        <option value="🎵">🎵 Концерт</option>
        <option value="🌙">🌙 Ночной клуб</option>
        <option value="🔥">🔥 Горячее событие</option>
        <option value="🎸">🎸 Рок / живая музыка</option>
        <option value="🌊">🌊 Open air</option>
      </select>
      <div style="display:flex;gap:10px">
        <button onclick="cancelForm()" style="flex:1;padding:14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#888;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif">Отмена</button>
        <button onclick="saveEvent()" style="flex:2;padding:14px;border-radius:12px;background:linear-gradient(90deg,#8b00ff,#ff0099);border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif">Сохранить</button>
      </div>
    </div>
  </div>

  <div class="admin-section">
    <div class="admin-section-title">Все события</div>
    <div id="admin-events-list"></div>
  </div>
</div>

<script>
// ── ДАННЫЕ ──────────────────────────────────────────────
let events = JSON.parse(localStorage.getItem('cloute_events') || '[]');
let currentEvent = null;

// Демо-события для первого запуска
if (events.length === 0) {
  events = [
    { id: 1, name: 'NEON RAVE PARTY', date: '24.05.2026', time: '22:00', venue: 'Fabric Club, Москва', price: '800 ₽', link: '', desc: 'Главная неоновая вечеринка мая. DJ Svet & guests. Дресс-код: неон и глиттер.', emoji: '🌙', hot: true },
    { id: 2, name: 'SUMMER KICKOFF', date: '31.05.2026', time: '19:00', venue: 'Roof Bar 22, Москва', price: '1 200 ₽', link: '', desc: 'Открытие летнего сезона на крыше. Open bar первый час. Закат + музыка.', emoji: '🌊', hot: false },
  ];
  saveToStorage();
}

function saveToStorage() {
  localStorage.setItem('cloute_events', JSON.stringify(events));
}

// ── НАВИГАЦИЯ ────────────────────────────────────────────
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
function showHome() { showView('view-home'); renderEvents(events); }
function showAdmin() { showView('view-admin'); renderAdmin(); }
function showDetail(id) {
  currentEvent = events.find(e => e.id === id);
  if (!currentEvent) return;
  document.getElementById('detail-name').textContent = currentEvent.name;
  document.getElementById('detail-emoji').textContent = currentEvent.emoji;
  document.getElementById('detail-desc').textContent = currentEvent.desc || 'Подробности скоро появятся.';
  document.getElementById('detail-info').innerHTML = `
    <div class="detail-row"><div class="detail-row-icon">📅</div><div class="detail-row-text"><div class="detail-row-label">Дата</div><div class="detail-row-val">${currentEvent.date}</div></div></div>
    <div class="detail-row"><div class="detail-row-icon">⏰</div><div class="detail-row-text"><div class="detail-row-label">Время</div><div class="detail-row-val">${currentEvent.time}</div></div></div>
    <div class="detail-row"><div class="detail-row-icon">📍</div><div class="detail-row-text"><div class="detail-row-label">Место</div><div class="detail-row-val">${currentEvent.venue}</div></div></div>
    <div class="detail-row"><div class="detail-row-icon">💵</div><div class="detail-row-text"><div class="detail-row-label">Вход</div><div class="detail-row-val">${currentEvent.price}</div></div></div>
  `;
  const buyBtn = document.getElementById('detail-buy');
  if (currentEvent.link) {
    buyBtn.textContent = '🎟 Купить билет';
    buyBtn.style.display = 'block';
  } else {
    buyBtn.textContent = '✉️ Написать организатору';
    buyBtn.style.display = 'block';
  }
  showView('view-detail');
}

function buyTicket() {
  if (currentEvent?.link) {
    window.open(currentEvent.link, '_blank');
  } else {
    if (window.Telegram?.WebApp) {
      window.Telegram.WebApp.showAlert('Для покупки билета напиши организатору в боте!');
    } else {
      alert('Для покупки билета напиши организатору!');
    }
  }
}

// ── РЕНДЕР СОБЫТИЙ ───────────────────────────────────────
function renderEvents(list) {
  const container = document.getElementById('events-list');
  document.getElementById('total-count').textContent = events.length;
  document.getElementById('this-week-count').textContent = events.length;

  if (list.length === 0) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">🎉</div><div class="empty-text">Скоро здесь появятся<br>первые тусовки!</div></div>`;
    return;
  }

  container.innerHTML = list.map(ev => `
    <div class="event-card ${ev.hot ? 'hot' : ''}" onclick="showDetail(${ev.id})">
      <div class="event-img">
        <span>${ev.emoji}</span>
        <div class="event-img-bg"></div>
        <div class="event-badges">
          ${ev.hot ? '<span class="badge badge-hot">🔥 Хит</span>' : ''}
          ${ev.price === 'бесплатно' || ev.price === 'Бесплатно' ? '<span class="badge badge-free">Бесплатно</span>' : ''}
        </div>
      </div>
      <div class="event-body">
        <div class="event-date-row">
          <div class="event-date">${ev.date} · ${ev.time}</div>
          <div class="event-price">${ev.price}</div>
        </div>
        <div class="event-name">${ev.name}</div>
        <div class="event-place">📍 ${ev.venue}</div>
        <div class="event-footer">
          <div class="event-time">Нажми чтобы узнать больше</div>
          <button class="btn-details">Подробнее →</button>
        </div>
      </div>
    </div>
  `).join('');
}

function filterEvents(filter, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderEvents(events);
}

// ── ADMIN ────────────────────────────────────────────────
function renderAdmin() {
  document.getElementById('admin-total').textContent = events.length;
  document.getElementById('admin-month').textContent = events.length;
  const list = document.getElementById('admin-events-list');
  if (events.length === 0) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">Событий пока нет</div></div>`;
    return;
  }
  list.innerHTML = events.map(ev => `
    <div class="admin-event-card">
      <div class="admin-event-info">
        <div class="aei-name">${ev.emoji} ${ev.name}</div>
        <div class="aei-date">${ev.date} · ${ev.venue}</div>
      </div>
      <button class="delete-btn" onclick="deleteEvent(${ev.id})">🗑 Удалить</button>
    </div>
  `).join('');
}

function showAddForm() {
  document.getElementById('add-form').style.display = 'block';
  document.querySelector('.add-event-btn').style.display = 'none';
}
function cancelForm() {
  document.getElementById('add-form').style.display = 'none';
  document.querySelector('.add-event-btn').style.display = 'flex';
  ['f-name','f-date','f-time','f-venue','f-price','f-link','f-desc'].forEach(id => document.getElementById(id).value = '');
}

function saveEvent() {
  const name = document.getElementById('f-name').value.trim();
  const date = document.getElementById('f-date').value.trim();
  if (!name || !date) {
    alert('Заполни хотя бы название и дату!'); return;
  }
  const newEvent = {
    id: Date.now(),
    name,
    date,
    time: document.getElementById('f-time').value.trim() || '—',
    venue: document.getElementById('f-venue').value.trim() || 'Место уточняется',
    price: document.getElementById('f-price').value.trim() || 'Уточняется',
    link: document.getElementById('f-link').value.trim(),
    desc: document.getElementById('f-desc').value.trim(),
    emoji: document.getElementById('f-emoji').value,
    hot: false,
  };
  events.unshift(newEvent);
  saveToStorage();
  cancelForm();
  renderAdmin();
}

function deleteEvent(id) {
  if (!confirm('Удалить это событие?')) return;
  events = events.filter(e => e.id !== id);
  saveToStorage();
  renderAdmin();
}

// ── INIT ─────────────────────────────────────────────────
if (window.Telegram?.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}
renderEvents(events);
</script>
</body>
